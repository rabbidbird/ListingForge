services:
  db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: truedraft
      POSTGRES_USER: truedraft
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truedraft -d truedraft"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - truedraft_postgres:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: development
      DATABASE_URL: postgresql://truedraft:local-development-only@db:5432/truedraft
      PUBLIC_BASE_URL: http://localhost:8080
      SESSION_SECRET: local-development-session-secret-change-before-use
      SESSION_COOKIE_SECURE: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/auth/google/callback}
      STRIPE_WEBHOOK_SECRET: whsec_local-container-smoke-only
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  truedraft_postgres:
