name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENV: test
      DATABASE_URL: sqlite:///data/ci.db
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11.13"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply migrations
        run: python -m alembic upgrade head
      - name: Lint
        run: |
          ruff format --check .
          ruff check .
      - name: Test
        run: python -m pytest
      - name: Import and health smoke
        run: python -m scripts.smoke
      - name: Launch readiness report
        run: python -m scripts.launch_check

  container-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and start production-shaped stack
        run: docker compose up --build --detach
      - name: Wait for HTTP health check
        shell: bash
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Exercise auth, webhook idempotency, and WebSocket proxy
        run: docker compose exec -T app python -m scripts.container_smoke
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
